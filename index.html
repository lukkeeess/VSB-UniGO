<!DOCTYPE html>
<html lang="cs" class="light">
<head>
  <!-- Propojení s PWA manifestem -->
  <link rel="manifest" href="manifest.json">
  
  <!-- KLÍČOVÉ: Nastavení pro zobrazení 1:1 na mobilech a podpora výřezů (Notch / Dynamic Island) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Vzhled pro iPhone (skryje adresní řádek prohlížeče) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniGO">
  
  <!-- Ikona aplikace, která se zobrazí na ploše iPhonu -->
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <meta charset="UTF-8">
  <title>VŠB UniGO - Oficiální kampusová navigace</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/bahnschrift">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- QRCode.js pro generování QR kódů -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vsb: { 50: '#e6f4f1', 100: '#cce9e3', 500: '#004b3c', 600: '#003a2e', 700: '#002920' },
          },
          fontFamily: { bahnschrift: ['Bahnschrift', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Bahnschrift', sans-serif; 
      overflow: hidden;
      /* Ochrana pro iOS lištu a dynamic island */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
    }
    .sos-pulsing { animation: pulse-red 1.5s infinite; }
    
    @keyframes pulse-blue {
      0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
      70% { box-shadow: 0 0 0 15px rgba(59,130,246,0); }
      100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
    }

    .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .leaflet-popup-content { margin: 0; line-height: 1.5; }
    .leaflet-popup-close-button { color: white !important; top: 10px !important; right: 10px !important; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 h-screen w-screen flex items-center justify-center p-0 sm:p-4 transition-colors duration-300">

  <!-- 0. VÝBĚR ZAŘÍZENÍ PŘI SPUŠTĚNÍ -->
  <div id="screen-device-select" class="fixed inset-0 z-50 bg-gray-950/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 w-full max-w-md rounded-[32px] p-6 text-center space-y-6 shadow-2xl border border-gray-200 dark:border-gray-800">
      <div class="w-16 h-16 bg-vsb-500 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <h2 class="text-2xl font-bold text-vsb-500 dark:text-vsb-100">VŠB UniGO</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 uppercase tracking-wider font-semibold">Zvolte režim zobrazení aplikace</p>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <button onclick="setDeviceMode('mobile')" class="p-4 bg-gray-50 dark:bg-gray-800 hover:bg-vsb-50 border-2 border-transparent hover:border-vsb-500 rounded-2xl flex flex-col items-center gap-2 transition">
          <i class="fa-solid fa-mobile-screen text-2xl text-vsb-500"></i><span class="text-xs font-bold">Mobil</span>
        </button>
        <button onclick="setDeviceMode('tablet')" class="p-4 bg-gray-50 dark:bg-gray-800 hover:bg-vsb-50 border-2 border-transparent hover:border-vsb-500 rounded-2xl flex flex-col items-center gap-2 transition">
          <i class="fa-solid fa-tablet-screen-button text-2xl text-vsb-500"></i><span class="text-xs font-bold">Tablet</span>
        </button>
        <button onclick="setDeviceMode('desktop')" class="p-4 bg-gray-50 dark:bg-gray-800 hover:bg-vsb-50 border-2 border-transparent hover:border-vsb-500 rounded-2xl flex flex-col items-center gap-2 transition">
          <i class="fa-solid fa-desktop text-2xl text-vsb-500"></i><span class="text-xs font-bold">PC / Web</span>
        </button>
      </div>
    </div>
  </div>


  <!-- HLAVNÍ KONTEJNER APLIKACE: Upraveno na w-full h-full, aby na mobilu nezůstávaly okraje a aplikace běžela přes celý displej -->
  <div id="app-wrapper" class="w-full h-full sm:h-[880px] bg-white dark:bg-gray-900 sm:rounded-[36px] sm:shadow-2xl overflow-hidden flex flex-col relative sm:max-w-[420px] mx-auto border-0 sm:border border-gray-200 dark:border-gray-800">

    <!-- 1. PŘIHLÁŠENÍ & REGISTRACE -->
    <div id="screen-auth" class="absolute inset-0 z-40 bg-white dark:bg-gray-900 p-6 flex flex-col justify-between overflow-y-auto">
      <div class="my-auto">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-14 h-14 bg-vsb-500 rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div>
            <h1 class="text-3xl font-bold tracking-tight text-vsb-500 dark:text-vsb-100">VŠB UniGO</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase">Oficiální kampusová aplikace</p>
          </div>
        </div>

        <div class="flex bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-6">
          <button onclick="switchAuthTab('login')" id="tab-login-btn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-700 shadow-sm transition">Přihlásit se</button>
          <button onclick="switchAuthTab('register')" id="tab-reg-btn" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-500 transition">Nový účet</button>
        </div>

        <!-- FORMULÁŘ: PŘIHLÁŠENÍ -->
        <div id="form-login" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">E-mail</label>
            <input type="email" id="login-email" value="tomas.student@vsb.cz" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:border-vsb-500">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Heslo</label>
            <input type="password" id="login-pass" value="heslo123" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:border-vsb-500">
          </div>
          <button onclick="handleLogin()" class="w-full py-3.5 bg-vsb-500 hover:bg-vsb-600 text-white font-bold rounded-xl shadow-lg transition mt-4">Vstoupit do kampusu</button>
        </div>

        <!-- FORMULÁŘ: REGISTRACE -->
        <div id="form-register" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Celé jméno</label>
            <input type="text" id="reg-name" placeholder="Jan Novák" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">E-mail (@vsb.cz)</label>
            <input type="email" id="reg-email" placeholder="jan.novak@vsb.cz" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Fakulta</label>
            <select id="reg-faculty" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 text-sm font-bold text-vsb-500">
              <option value="FEI">Fakulta elektrotechniky a informatiky (FEI)</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
